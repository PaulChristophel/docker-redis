name: Build and publish Redis images

on:
  push:
    branches: [master]
    paths:
      - '*.dockerfile'
      - '*.sh'
      - '*.conf'
      - images.json
      - scripts/build-image.sh
      - .github/workflows/release.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.matrix.outputs.image }}
      platform: ${{ steps.matrix.outputs.platform }}
      jobs: ${{ steps.matrix.outputs.jobs }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Read images.json
        id: matrix
        run: |
          echo "image=$(jq -er '.image' images.json)" >> "$GITHUB_OUTPUT"
          echo "platform=$(jq -er '.platform' images.json)" >> "$GITHUB_OUTPUT"
          echo "jobs=$(jq -er '.defaults.build_jobs' images.json)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -ce '.distributions as $os | {include: [.redis[] as $redis | .variants[] | {redis: $redis, variant: ., base: $os[.os].base}]}' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Redis ${{ matrix.redis.version }} ${{ matrix.variant.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # actions/attest's registry client reads ~/.docker/config.json directly.
      - name: Set registry credential paths
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$HOME/.docker" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$HOME/.docker/config.json" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | podman login \
            --compat-auth-file "$REGISTRY_AUTH_FILE" \
            docker.io --username pcm0 --password-stdin
      - name: Build and test image
        env:
          REDIS_VERSION: ${{ matrix.redis.version }}
          VARIANT: ${{ matrix.variant.tag }}
        run: ./scripts/build-image.sh
      - name: Publish image
        id: push
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ matrix.redis.version }}-${{ matrix.variant.tag }}
        run: |
          sha_image="${IMAGE}-sha-${GITHUB_SHA:0:7}"
          podman tag "$IMAGE" "$sha_image"
          podman push --digestfile image-sha-digest.txt "$sha_image"
          podman push --digestfile image-digest.txt "$IMAGE"
          cmp image-digest.txt image-sha-digest.txt
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
      - name: Save published image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.redis.version }}-${{ matrix.variant.tag }}
          path: image-digest.txt
          if-no-files-found: error

  attest:
    name: Attest Redis ${{ matrix.redis.version }} ${{ matrix.variant.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Download published image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest-${{ matrix.redis.version }}-${{ matrix.variant.tag }}
          path: published-image
      - name: Read published image digest
        id: digest
        shell: bash
        run: |
          digest=$(cat published-image/image-digest.txt)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # actions/attest's registry client reads ~/.docker/config.json directly.
      - name: Set registry credential paths
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$HOME/.docker" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$HOME/.docker/config.json" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | podman login \
            --compat-auth-file "$REGISTRY_AUTH_FILE" \
            docker.io --username pcm0 --password-stdin
      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
